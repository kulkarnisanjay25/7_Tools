function lin(x,y){const n=x.length,mx=mean(x),my=mean(y);let sxx=0,sxy=0,syy=0;x.forEach((a,i)=>{sxx+=(a-mx)**2;sxy+=(a-mx)*(y[i]-my);syy+=(y[i]-my)**2});const b1=sxy/sxx,b0=my-b1*mx;let sse=0,pr=0;x.forEach((a,i)=>{const e=y[i]-b0-b1*a,h=1/n+(a-mx)**2/sxx;sse+=e*e;pr+=(e/(1-h))**2});

</style></head><body><div class="w">
<h1>Control Chart Selection Guide</h1><p class="sub">Variable (measured) and attribute (counted) charts: which one to use, where, and practice data in Stat Studio.</p>


<h2>1. Two kinds of data</h2>
<div class="g2"><div class="c v"><h3>Variable data <span class="tag tv">measured</span></h3><p class="use">A number on a continuous scale: length, weight, time, temperature, pressure, cost.</p><p>Gives more information per reading, so it needs smaller samples and detects shifts sooner.</p></div>
<div class="c a"><h3>Attribute data <span class="tag ta">counted</span></h3><p class="use">A count of pass/fail items or of defects.</p><p><b>Defective</b> = a whole item is bad (1 item, good or bad). <b>Defect</b> = one flaw; an item can have many.<br>Example: a shirt with 3 stains is <b>1 defective</b> and has <b>3 defects</b>.</p></div></div>

<h2>2. Which chart? Follow the questions</h2>
<ul class="tree"><li><span class="q">Is the data measured or counted?</span>
<ul><li><span class="ed">Measured →</span><span class="q">How many readings in each subgroup?</span>
<ul><li><span class="ed">1 (one reading at a time)</span><span class="ans av">I-MR</span></li><li><span class="ed">2 to 8</span><span class="ans av">Xbar-R</span></li><li><span class="ed">9 or more</span><span class="ans av">Xbar-S</span></li></ul></li>
<li><span class="ed">Counted →</span><span class="q">Counting defective items, or defects?</span>
<ul><li><span class="ed">Defective items →</span><span class="q">Is the sample size constant?</span><ul><li><span class="ed">Yes</span><span class="ans aa">NP</span></li><li><span class="ed">No</span><span class="ans aa">P</span></li></ul></li>
<li><span class="ed">Defects →</span><span class="q">Is the area / opportunity constant?</span><ul><li><span class="ed">Yes</span><span class="ans aa">C</span></li><li><span class="ed">No</span><span class="ans aa">U</span></li></ul></li></ul></li></ul></li></ul>

<h2>3. Quick reference</h2>
<div class="tw"><table><tr><th>Chart</th><th>Plots</th><th>Centre line and limits</th><th>Stat Studio menu</th><th>Practice columns</th></tr>
<tr><td><b>I-MR</b></td><td>Each value; moving range</td><td>X̄ ± 2.66 MR̄ ; MR: 3.267 MR̄</td><td>Stat › Control Charts › I-MR</td><td>Diameter</td></tr>
<tr><td><b>Xbar-R</b></td><td>Subgroup mean; range</td><td>X̿ ± A2 R̄ ; D3 R̄, D4 R̄</td><td>… › Xbar-R</td><td>Diameter, size 5</td></tr>
<tr><td><b>Xbar-S</b></td><td>Subgroup mean; std dev</td><td>X̿ ± A3 S̄ ; B3 S̄, B4 S̄</td><td>… › Xbar-S</td><td>Diameter, size 5 to 10</td></tr>
<tr><td><b>P</b></td><td>Proportion defective</td><td>p̄ ± 3√(p̄(1−p̄)/n), changes with n</td><td>… › P Chart</td><td>Rejects, Lot_Size</td></tr>
<tr><td><b>NP</b></td><td>Number defective</td><td>np̄ ± 3√(np̄(1−p̄))</td><td>… › NP Chart</td><td>Faulty (n = 100)</td></tr>
<tr><td><b>C</b></td><td>Defects per unit</td><td>c̄ ± 3√c̄</td><td>… › C Chart</td><td>Flaws</td></tr>
<tr><td><b>U</b></td><td>Defects per unit of size n</td><td>ū ± 3√(ū/n), changes with n</td><td>… › U Chart</td><td>Errors, Pages</td></tr></table></div>

<h2>4. Variable charts and where to use them</h2><div class="g2">
<div class="c v"><h3>I-MR <span class="tag tv">n = 1</span></h3><p class="use">One reading per time period; the data are slow or costly to get.</p><ul><li>Viscosity of each batch of paint</li><li>Monthly electricity consumption of a plant</li><li>Concentration in a process tank, tested once per shift</li><li>Time taken to process each loan application</li><li>Strength from a destructive test (1 piece per lot)</li></ul><div class="pr">Practice: Diameter column (Stat › Control Charts › I-MR).</div></div>
<div class="c v"><h3>Xbar-R <span class="tag tv">n = 2 to 8</span></h3><p class="use">Small rational subgroups taken together from the same stream.</p><ul><li>Shaft diameter: 5 consecutive parts every hour</li><li>Fill weight of 4 bottles every 30 minutes</li><li>Lab turnaround time: 5 reports per shift</li><li>Paint film thickness on 4 panels per batch</li><li>Cycle time of 5 consecutive machine cycles each hour</li></ul><div class="pr">Practice: Diameter column, subgroup size 5.</div></div>
<div class="c v"><h3>Xbar-S <span class="tag tv">n ≥ 9</span></h3><p class="use">Large subgroups, where the range wastes information.</p><ul><li>Tablet weight: 10 tablets from the press every 15 minutes</li><li>Bore diameter of the 10 cavities in a mould, each shot</li><li>Tensile strength of 12 coupons per spool lot</li><li>Fabric thickness at 10 points across a roll</li><li>Fill volume of a 12-head filler, measured together</li></ul><div class="pr">Practice: Diameter column, subgroup size 10 (or 5).</div></div></div>

<h2>5. Attribute charts and where to use them</h2><div class="g2">
<div class="c a"><h3>P chart <span class="tag ta">defective, n varies</span></h3><p class="use">Fraction of items that fail; the sample size changes.</p><ul><li>Fraction of invoices with errors each day (volume varies)</li><li>Proportion of castings rejected per lot</li><li>Share of patients readmitted within 30 days, per month</li><li>Fraction of late deliveries per week</li><li>Proportion of orders returned by customers per day</li></ul><div class="pr">Practice: Rejects with Lot_Size. Sample 18 is out of control.</div></div>
<div class="c a"><h3>NP chart <span class="tag ta">defective, n constant</span></h3><p class="use">Number of defective items in a fixed-size sample.</p><ul><li>Defective bulbs in a fixed sample of 100 per shift</li><li>Leaking bottles in 100 checked every hour</li><li>Incorrect entries in an audit of 50 forms</li><li>Failed units in a 30-piece pass/fail test per batch</li><li>Non-conforming parts in 200 inspected per lot</li></ul><div class="pr">Practice: Faulty column, subgroup size 100. Sample 12 is out of control.</div></div>
<div class="c a"><h3>C chart <span class="tag ta">defects, area constant</span></h3><p class="use">Number of defects on equal-sized units.</p><ul><li>Scratches on each painted panel of the same size</li><li>Bubbles in each 1 m² glass sheet</li><li>Typing errors per fixed-length document</li><li>Soldering defects per circuit board of one type</li><li>Customer complaints per week, or near-misses per month</li></ul><div class="pr">Practice: Flaws column. Sample 9 is out of control.</div></div>
<div class="c a"><h3>U chart <span class="tag ta">defects, size varies</span></h3><p class="use">Defects per unit when the amount inspected changes.</p><ul><li>Flaws per metre of cable, with varying lengths checked</li><li>Errors per report of different page counts</li><li>Bugs per 1000 lines in modules of different size</li><li>Falls per 1000 patient-days, with varying patient-days</li><li>Paint defects per car body in batches of different size</li></ul><div class="pr">Practice: Errors with Pages. Sample 21 is out of control.</div></div></div>

<h2>6. Test yourself: choose the chart</h2>
<details><summary>A. Weight of 5 pills taken from the press every hour</summary><p>Xbar-R: measured, subgroup of 5.</p></details>
<details><summary>B. Percentage of orders shipped late each day; daily orders vary</summary><p>P chart: defective orders, changing sample size.</p></details>
<details><summary>C. Bubbles on each 1 m² glass sheet</summary><p>C chart: defects, constant area.</p></details>
<details><summary>D. Furnace temperature logged once per hour</summary><p>I-MR: one reading at a time.</p></details>
<details><summary>E. Failed units among a fixed 50-piece sample from each lot</summary><p>NP chart: defective items, constant sample size.</p></details>
<details><summary>F. Errors per 1000 lines of code in modules of different size</summary><p>U chart: defects, changing amount inspected.</p></details>
<details><summary>G. Fill volume of all 12 filling heads, measured together every 15 minutes</summary><p>Xbar-S: measured, subgroup of 12.</p></details>

<h2>7. Good practice</h2>
<div class="warn"><b>Control limits are not specification limits.</b> Limits come from the process data, specs come from the customer. Never draw one on the other.</div>
<ul><li><b>Stable first, capable second.</b> Check the control chart before quoting Cp or Cpk.</li>
<li><b>Rational subgroups.</b> Take items produced close together, so variation inside a subgroup is common-cause only.</li>
<li><b>Use 20 to 25 subgroups</b> to set trial limits, and reset them only after a verified process change.</li>
<li><b>Investigate special causes.</b> A flagged point means find out what changed; adjusting for common-cause noise makes things worse.</li>
<li><b>Count correctly.</b> Defectives go on P or NP, defects on C or U. A mix-up gives wrong limits.</li></ul>
<h2>8. Beyond these charts</h2>
<ul><li><b>Small, persistent shifts:</b> CUSUM or EWMA charts.</li><li><b>Rare events:</b> g chart (items between events) or t chart (time between events).</li><li><b>Many short runs or products:</b> Z-MR (standardised) charts.</li><li><b>Several streams or heads:</b> separate charts per stream, or a between/within chart.</li></ul>
<p class="sub">Stat Studio draws I-MR, Xbar-R, Xbar-S, P, NP, C and U. The charts in section 8 are not in the program.</p>
<h2>9. Tests for special causes</h2><p>Sigma (σ) is one third of the distance from the centre line to a control limit. A failed point is labelled on the chart with its test number; two failed tests at one point show both digits (for example 16).</p><div class="tw"><table><tr><th>Test</th><th>Pattern</th><th>Likely meaning</th><th>What to check</th></tr><tr><td><b>1</b></td><td>One point beyond 3σ (outside the control limits)</td><td>A sudden large change</td><td>setup, material lot, measurement or data-entry error</td></tr><tr><td><b>2</b></td><td>9 in a row on the same side of the centre line</td><td>A small, lasting shift in the mean</td><td>what changed when the run started: operator, setting, material</td></tr><tr><td><b>3</b></td><td>6 in a row, all rising or all falling</td><td>A trend or drift</td><td>tool wear, temperature drift, a consumable running down</td></tr><tr><td><b>4</b></td><td>14 in a row, alternating up and down</td><td>Over-adjusting, or two streams mixed</td><td>adjustment practice; separate machines or shifts</td></tr><tr><td><b>5</b></td><td>2 of 3 beyond 2σ, same side</td><td>An early signal of a shift</td><td>recent changes; keep watching</td></tr><tr><td><b>6</b></td><td>4 of 5 beyond 1σ, same side</td><td>An early signal of a smaller shift</td><td>input materials and slow changes</td></tr><tr><td><b>7</b></td><td>15 in a row within 1σ (both sides)</td><td>Variation looks too small</td><td>mixed streams inside subgroups, poor gauge resolution, limits too wide</td></tr><tr><td><b>8</b></td><td>8 in a row beyond 1σ (both sides)</td><td>Two populations taking turns</td><td>machine, material or shift; stratify the data</td></tr></table></div><p>I and Xbar charts can use Tests 1 to 8. MR, R and S charts use Test 1 only. P, NP, C and U charts offer Tests 1 and 2. A flag is a reason to investigate, not proof; the more tests you switch on, the more false alarms you will get. Start with Test 1 only, add Test 2, then use all tests to look for smaller changes.</p><h2>10. When a point fails</h2><ol><li><b>Mark it.</b> Note the point number, date, shift and batch from the worksheet.</li><li><b>Check the data first.</b> Typing error, wrong unit, faulty gauge? Re-measure if you can.</li><li><b>Ask what changed</b> at that time: Man, Machine, Method, Material, Measurement, Environment.</li><li><b>Stratify</b> by machine, shift or material to see if one group is different.</li><li><b>Act on the cause.</b> Do not adjust the process for points inside the limits.</li><li><b>Reset the limits only after a verified change,</b> using at least 20 to 25 new subgroups.</li></ol><p class="foot">All sample data in Stat Studio is simulated for training.</p>
</div></body></html>
`;
function tests8(v,cl,u,l,mode){const sg=(u-cl)/3,z=v.map(x=>(x-cl)/sg),T=Array.from({length:8},()=>[]),d=i=>v[i]-v[i-1],run=(f,k,t)=>{let c=0;v.forEach((_,i)=>{c=f(i)?c+1:0;if(c>=k)T[t].push(i)})};
v.forEach((x,i)=>{if(x>u||x<l)T[0].push(i)});if(mode<1)return T;
let c=0,s0=0;z.forEach((a,i)=>{const s=a>0?1:a<0?-1:0;if(s&&s==s0)c++;else{c=s?1:0;s0=s}if(c>=9)T[1].push(i)});if(mode<2)return T;
run(i=>i>0&&d(i)>0,5,2);run(i=>i>0&&d(i)<0,5,2);run(i=>i>1&&d(i)*d(i-1)<0,12,3);
z.forEach((_,i)=>{for(const s of[1,-1]){if(i>1&&[z[i-2],z[i-1],z[i]].filter(a=>a*s>2).length>=2&&z[i]*s>2)T[4].push(i);if(i>3&&z.slice(i-4,i+1).filter(a=>a*s>1).length>=4&&z[i]*s>1)T[5].push(i)}});
run(i=>Math.abs(z[i])<1,15,6);run(i=>Math.abs(z[i])>1,8,7);T.forEach(a=>a.sort((x,y)=>x-y));return T}
function tout(nm,t,off=0){let s='Test Results for '+nm+'\n',any=0;t.forEach((a,i)=>{if(a.length){any=1;s+=`\nTEST ${i+1}. ${MSG[i]}\nTest Failed at points: ${a.map(j=>j+1+off).join(', ')}\n${hints?`  Stat Studio hint: ${TI[i][1]}. Check: ${TI[i][2]}.\n`:''}`}});return s+(any?'':'\nNo points failed the tests performed.')}
function erfc(x){const z=Math.abs(x);let r;if(z<2.5){let t=z,q=z,n=0;do{n++;t*=-z*z/n;q+=t/(2*n+1)}while(Math.abs(t)>1e-18);r=1-2/Math.sqrt(Math.PI)*q}else{let f=0;for(let k=150;k>=1;k--)f=k/2/(z+f);r=Math.exp(-z*z)/Math.sqrt(Math.PI)/(z+f)}return x>=0?r:2-r}
const Phi=z=>.5*erfc(-z/Math.SQRT2),c4f=m=>Math.sqrt(2/(m-1))*Math.exp(lg(m/2)-lg((m-1)/2)),D2=[1.128,1.693,2.059,2.326,2.534,2.704,2.847,2.97,3.078],pf=s=>String(s).trim()===''?NaN:Number(s);
function atests(v,cl,u,l,m){const q=(a,i)=>Array.isArray(a)?a[i]:a,T=[[],[]];v.forEach((x,i)=>{if(x>q(u,i)||x<q(l,i))T[0].push(i)});if(m>0){let c=0,s0=0;v.forEach((a,i)=>{const s=a>cl?1:a<cl?-1:0;if(s&&s==s0)c++;else{c=s?1:0;s0=s}if(c>=9)T[1].push(i)})}return T}
function att(k,v){const nm=C[v.x].n,d=[],sz=[];nums(v.x).forEach((a,i)=>{if(isNaN(a))return;const n=k=='p'||k=='u'?num1(v.s,i):k=='np'?v.n:1;if(isNaN(n)||n<=0)return;d.push(a);sz.push(n)});if(d.length<5)throw Error('Need at least 5 subgroups.');
const S=sum(d),M=sum(sz),f=a=>a.every(z=>z==a[0])?a[0]:a,sq=Math.sqrt;let cl,pl,u,l,ti,yl,cn;

else if(k=='c'){cl=mean(d);pl=d;u=cl+3*sq(cl);l=Math.max(0,cl-3*sq(cl));ti='C';yl='Sample Count';cn='C̄'}
else{cl=S/M;pl=d.map((a,i)=>a/sz[i]);u=f(sz.map(n=>cl+3*sq(cl/n)));l=f(sz.map(n=>Math.max(0,cl-3*sq(cl/n))));ti='U';yl='Sample Count Per Unit';cn='Ū'}
const t=atests(pl,cl,u,l,v.tm>0?1:0);out(ti+' Chart of '+nm,tout(ti+' Chart of '+nm,t));gw(ti+' Chart',csvg({title:ti+' Chart of '+nm,v:pl,cl,ucl:u,lcl:l,cn,t,xl:'Sample',yl}))}

/* ---------- graphs ---------- */
function frame(o){const W=700,H=o.H||440,L=70,R=o.R||30,T=46,B=62,sx=v=>L+(v-o.x[0])/(o.x[1]-o.x[0])*(W-L-R),sy=v=>H-B-(v-o.y[0])/(o.y[1]-o.y[0])*(H-T-B);

s+=o.body(sx,sy);(o.xt||ticks(...o.x).map(v=>[v,fmtT(v)])).forEach(([v,t])=>s+=`<line x1="${sx(v)}" x2="${sx(v)}" y1="${H-B}" y2="${H-B+4}" stroke="#555"/><text x="${sx(v)}" y="${H-B+16}" text-anchor="middle">${esc(t)}</text>`);
(o.yt||ticks(...o.y).map(v=>[v,fmtT(v)])).forEach(([v,t])=>s+=`<line x1="${L-4}" x2="${L}" y1="${sy(v)}" y2="${sy(v)}" stroke="#555"/><text x="${L-7}" y="${sy(v)+4}" text-anchor="end">${t}</text>`);
(o.rt||[]).forEach(([v,t])=>s+=`<text x="${W-R+7}" y="${sy(v)+4}">${t}</text>`);
return s+`<text x="${(L+W-R)/2}" y="${H-12}" text-anchor="middle" font-size="12" font-weight="600">${esc(o.xl||'')}</text><text transform="translate(16 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12" font-weight="600">${esc(o.yl||'')}</text></svg>`}
function edges(a){const mn=Math.min(...a),mx=Math.max(...a),k=Math.ceil(1+Math.log2(a.length)),raw=((mx-mn)||1)/k,p=10**Math.floor(Math.log10(raw)),m=raw/p,st=(m<1.5?1:m<3?2:m<7?5:10)*p,m0=Math.round(mn/st+1e-9)*st,e=[+(m0-st/2).toPrecision(12)];let x=m0-st/2;while(x<=mx+1e-9){x+=st;e.push(+x.toPrecision(12))}return e}
const cnt=(a,ed)=>ed.slice(1).map((h,i)=>a.filter(x=>x>=ed[i]&&x<h).length),ymx=(a,ed,fit)=>Math.max(...cnt(a,ed),fit&&a.length>1&&sd(a)>0?a.length*(ed[1]-ed[0])/(sd(a)*2.5066):0);

function openFile(){if(!window.XLSX)return alert('Excel reader could not load (no internet). Use File > Open from web link, or paste data into the worksheet.');const i=document.createElement('input');i.type='file';i.accept='.xlsx,.xls,.csv';i.onchange=async()=>{try{load(wb2c(XLSX.read(await i.files[0].arrayBuffer(),{type:'array'})))}catch(e){alert('Could not read file: '+e.message)}};i.click()}
async function refresh(){if(!webUrl)return alert('No web link set. Use File > Open from web link first.');try{const r=await fetch(webUrl);if(!r.ok)throw Error('HTTP '+r.status);load(wb2c(XLSX.read(await r.text(),{type:'string'})))}catch(e){alert('Could not load link: '+e.message)}}
async function enc(o){const b=new Uint8Array(await new Response(new Blob([JSON.stringify(o)]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let t='';b.forEach(x=>t+=String.fromCharCode(x));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
async function dec(t){const b=Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text())}
async function share(){try{const u=location.href.split('#')[0].split('?')[0]+'#d='+await enc({c:C,f:fish,l:fishes});try{navigator.clipboard.writeText(u)}catch(e){}modal('Share link',`<p>Send this link to trainees (WhatsApp, email). They will see exactly this worksheet and fishbone. Link copied to clipboard.</p><textarea rows=5 readonly style="width:100%" onclick="this.select()">${u}</textarea><p>Length: ${u.length} characters. For very large data use File &gt; Open from web link instead.</p>`)}catch(e){alert('Could not create link: '+e.message)}}
